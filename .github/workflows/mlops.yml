name: Intelligent CFD - MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-ai-engine:
    runs-on: ubuntu-latest
    
    # Inyectamos una llave temporal directo en la memoria del robot de pruebas
    env:
      API_KEY: "TEST_TEMPORAL_KEY"

    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v3

    - name: 2. Configurar el motor de Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: 3. Instalar librerías e IA
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx python-dotenv

    - name: 4. Ejecutar pruebas de físicas y seguridad (Pytest)
      run: |
        pytest tests/ -v